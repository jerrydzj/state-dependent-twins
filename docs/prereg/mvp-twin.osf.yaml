summary: |-
  This is the first registration for this project. It preregisters the primary test of a study comparing an LLM twin (Llama 3.1 8B Instruct) with supervised models at predicting answers to the five items of the Index of Consumer Sentiment, from August 2024 to February 2026. The plan states the hypothesis, the design, one primary test with its decision rule, the secondary analyses and the procedure. It was written before any twin prediction for an evaluation interview existed. The evaluation answers and the supervised models' evaluation scores were already known, as the plan discloses.

  The plan is frozen as git tag prereg/mvp-twin at commit e4b385b35ead830b8161e1ba009208d63178f39e (https://github.com/jerrydzj/state-dependent-twins/tree/prereg/mvp-twin). That commit also fixes the data hash, the prompts, the model revision and the calibration code. The attached file is an archive of the repository at that tag.
